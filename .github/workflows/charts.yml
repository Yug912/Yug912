name: Refresh charts

on:
  schedule:
    - cron: "30 0 * * *"   # daily, just after the UTC day rolls over
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: LeetCode chart
        run: python3 leetcode.py
        continue-on-error: true
      - name: Contribution calendar
        run: python3 contributions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode.svg assets/contributions.svg
          git diff --cached --quiet || (git commit -m "Refresh charts" && git push)
